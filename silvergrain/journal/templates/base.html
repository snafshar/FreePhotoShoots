<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Silvergrain, a black-and-white photography journal by {{ site.name }}.">
  <meta name="theme-color" content="#141414">
  <title>{% if title != 'Silvergrain' %}{{ title }} · {% endif %}Silvergrain</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="preload" href="/static/fonts/InstrumentSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/journal.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="Silvergrain home"><span class="brand-mark" aria-hidden="true"></span>Silvergrain</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/"{% if active == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="/journal"{% if active == 'journal' %} aria-current="page"{% endif %}>Journal</a>
        <a href="/contact"{% if active == 'contact' %} aria-current="page"{% endif %}>Contact</a>
      </nav>
      <a class="admin-link" href="/admin"{% if active == 'admin' %} aria-current="page"{% endif %}><span class="lock-icon" aria-hidden="true"></span>{% if is_admin %}Studio{% else %}Admin{% endif %}</a>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <a class="brand" href="/" aria-label="Silvergrain home"><span class="brand-mark" aria-hidden="true"></span>Silvergrain</a>
      <p>© {{ current_year() }} {{ site.name }}</p>
      <a class="small-link" href="/contact">Contact <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
